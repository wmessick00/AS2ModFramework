# Uploads a published GitHub release to the Nexus Mods page.
#
# Nothing is built here. tools\pack.ps1 runs on a machine that owns Audiosurf 2, because AS2.ModApi
# compile-references the game's own assemblies and a runner does not have them. That script creates
# the release, which fires this. So this only moves bytes that already exist: take the assets off
# the release, hand them to Nexus, and post the changelog.
#
# The changelog is the part of the release body above the nexus:end marker. pack.ps1 puts a
# "What changed" section there, and everything below it -- install steps, the checksum table -- is
# for somebody reading GitHub, not somebody on a mod page deciding whether to press update.
#
# Each job fetches its own asset rather than passing a build artifact between jobs. Three downloads
# of roughly 600 KB is cheaper than two more third-party actions to pin and keep current, and the
# release is the one copy of those bytes either way.
#
# Re-running this is NOT free, in two ways.
#
#   - The upload action adds a new version to a file slot every time it runs, so a re-run after a
#     partial failure leaves a duplicate version to delete by hand on Nexus.
#   - POST /mods/{id}/changelogs is additive. The API documents it as appending further text for a
#     version rather than replacing what is there, so a second run against the same version leaves
#     the changelog printed twice on the mod page.
#
# fail-fast is off so one bad slot does not take the others with it, which keeps both of those down
# to the slots that actually failed. If a re-run is needed after the changelog already posted, clear
# the changelog entry on Nexus first, or drop `changelog` from that entry in nexus-targets.json for
# the re-run.

name: Publish to Nexus Mods

on:
  release:
    types: [published]

  # For a re-run after a failure, and for the first run against an existing tag before anybody
  # trusts the release trigger.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.2.2
        required: true
        type: string

# Every job reads a release and writes nothing back to the repository. Same reasoning as
# cold-checks.yml: name the one scope the jobs need, so a step somebody adds later is already
# holding the smallest token there is.
permissions:
  contents: read

jobs:
  prepare:
    name: Read the release
    runs-on: ubuntu-latest

    outputs:
      tag:       ${{ steps.resolve.outputs.tag }}
      version:   ${{ steps.resolve.outputs.version }}
      changelog: ${{ steps.notes.outputs.changelog }}
      targets:   ${{ steps.targets.outputs.json }}

    steps:
      # Pinned to a commit SHA, not a tag. A tag is mutable, so an upstream that moves one runs
      # different code here on the next release and nothing in this file shows it. The trailing
      # comment gives the version. Same rule as cold-checks.yml and the BepInEx pin in pack.ps1.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag and the version
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG:-$EVENT_TAG}"

          # The rules are in tools/nexus-version.sh, where tests/Check-NexusPublish.sh runs them.
          # It prints the two outputs, or an ::error:: annotation and a failing exit code, and tee
          # keeps either in the log; pipefail is what lets that exit code through.
          bash tools/nexus-version.sh "$TAG" | tee resolved.txt

          grep -E '^(tag|version)=' resolved.txt >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG as version $(grep '^version=' resolved.txt | cut -d= -f2)"

      - name: Cut the changelog out of the release body
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # The rules -- the marker, the heading, an empty result, install text that leaked past the
          # marker -- are in tools/nexus-changelog.sh, which tests/Check-NexusPublish.sh runs on
          # release bodies of every shape. It writes the changelog to a file or fails with an
          # ::error:: annotation. This is what decides what the public mod page says, and posting
          # to it cannot be undone by running anything again.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | bash tools/nexus-changelog.sh "$TAG" changelog.txt

          # A random delimiter, because the body is arbitrary text and a fixed one appearing inside
          # it would end the value early and let the rest of the body be read as workflow commands.
          DELIM="nexus-$(openssl rand -hex 16)"
          {
            echo "changelog<<$DELIM"
            cat changelog.txt
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Build the upload list
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > on-release.txt

          # What is checked -- a placeholder id, who owns the changelog, every named asset being on
          # the release, an asset with no slot -- and how the list is built, are in
          # tools/nexus-targets.sh, which tests/Check-NexusPublish.sh runs against configurations no
          # real release would have.
          bash tools/nexus-targets.sh .github/nexus-targets.json "$VERSION" "$TAG" on-release.txt targets.json

          echo "json=$(cat targets.json)" >> "$GITHUB_OUTPUT"

  upload:
    name: ${{ matrix.target.asset }}
    needs: prepare
    runs-on: ubuntu-latest

    # The API key lives in an environment rather than loose in repository secrets, so reaching it
    # takes an approval that a change to this file on its own does not grant. It is the first secret
    # this repository has, and it can edit a live mod page.
    environment: nexus

    strategy:
      # One slot failing must not cancel the others. Every cancelled upload is one more version to
      # reconcile by hand on the next run.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}

    steps:
      - name: Fetch the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          FILENAME: ${{ matrix.target.filename }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILENAME"
          ls -l "$FILENAME"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key:  ${{ secrets.NEXUS_API_KEY }}
          mod_id:   ${{ matrix.target.mod_id }}
          file_id:  ${{ matrix.target.file_id }}
          # The release asset, verbatim. Carries the version.
          filename: ${{ matrix.target.filename }}

          # What the page calls the entry. No version, no extension.
          display_name: ${{ matrix.target.display_name }}
          version:  ${{ needs.prepare.outputs.version }}
          category: ${{ matrix.target.category }}

          # Only the entry that owns it. The other two slots would post the same text to the same
          # mod page.
          changelog: ${{ matrix.target.changelog && needs.prepare.outputs.changelog || '' }}
          update_mod_version: ${{ matrix.target.update_mod_version }}
          primary_mod_manager_download: ${{ matrix.target.primary_mod_manager_download }}

          # The previous version moves out of Main Files rather than sitting beside the new one.
          # Three packages on one page is already enough to read through.
          archive_existing_version: true
