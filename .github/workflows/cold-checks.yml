# Runs the cold checks in tests/ on every push and pull request.
#
# Only the checks. The rest of the repo cannot be built here and is not meant to be:
#   -every project under src/ resolves references out of Audiosurf2_Data\Managed
#   -AS2.ModApi binds to Assembly-CSharp, LuaInterface and UnityEngine besides
#   -none of that is redistributable, so it cannot be checked in or put on a runner
#
# Releases are built on a machine that owns Audiosurf 2 and uploaded by hand. See tools/pack.ps1.
# The check projects link the same source files against the desktop framework instead, which is the
# whole reason there is anything here to run.
#
# The runner is Windows, and both reasons matter:
#
#   1. The check projects target net48, which is .NET Framework and does not exist on Linux.
#   2. These checks encode Windows path semantics, because the game is Windows-only.
#      Path.GetInvalidFileNameChars() returns 2 characters on Linux and about 40 on Windows, so
#      "wild*card.json" is a legal file name there and PathGuard would accept it -- failing a check
#      that is asserting correct behaviour. The traversal cases lean on Windows drive parsing, and
#      the doorstop config checks assert CRLF line ends.
#      Moving to ubuntu-latest to save runner minutes would not make the suite cheaper. It would
#      make it wrong.
#
# The commands are the exact ones the wiki gives, so a failure here reproduces locally by copying
# one line.

name: Cold checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cold-checks:
    name: AS2.ModApi and AS2.Bootstrap
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Exits non-zero and prints the failing checks by name.
      # The project builds the real TargetResolver.cs, PathGuard.cs, Str.cs and SelectorKind.cs
      # rather than referencing the shipped DLL, so a change reaching for BepInEx or Unity from one
      # of those files breaks this step. That is the constraint working, not a problem to route
      # around.
      - name: Path and key logic
        run: dotnet run --project tests/AS2.ModApi.Tests

      # The doorstop_config.ini rewrite, also built from the real Bootstrap.cs.
      # Runs even when the step above failed: the two cover different assemblies, and one report of
      # both beats two pushes to learn the same thing.
      - name: Doorstop config rewrite
        if: '!cancelled()'
        run: dotnet run --project tests/AS2.Bootstrap.Tests
